name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.33.0'

jobs:
  # ---------------------------------------------------------------------------
  # Fast feedback: formatting, lint (incl. module boundaries), types.
  # ---------------------------------------------------------------------------
  static:
    name: Format, lint, typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `prisma generate` is an OFFLINE command: it reads the schema and writes
      # TypeScript. It deliberately requires no database URL, so this step runs
      # with no database environment at all. See packages/database/prisma.config.ts.
      - name: Generate Prisma client (no database environment required)
        run: pnpm --filter @brandspace/database exec prisma generate

      - name: Check formatting
        run: pnpm format:check

      - name: Lint (includes module boundary rules)
        run: pnpm lint

      # A 4 GB HEAP FOR TSC (D-454). `pnpm typecheck` checks every package in one
      # step, and the `tests` package alone uses about 2.7 GB on staging @ 2672bad
      # (`tsc --extendedDiagnostics`: Memory used 2,728,528K) — at the runner's
      # default Node heap, so it crashed out of memory on a PR that changed
      # nothing it measures. This is headroom only: no check is skipped.
      - name: Typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm typecheck

  # ---------------------------------------------------------------------------
  # D-29: a tenant-owned model without isolation coverage FAILS the build.
  # Runs as its own job so the failure is unmistakable in the checks list.
  # ---------------------------------------------------------------------------
  isolation-gate:
    name: Tenant-isolation gate (D-29)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Every tenant-owned model must have RLS and isolation coverage
        run: pnpm gate:isolation

  # ---------------------------------------------------------------------------
  # Unit tests. No database CONNECTION required — but the generated Prisma client
  # must exist, because unit tests import packages whose module graph reaches
  # @prisma/client (packages/config re-exports its service, which takes a client
  # type from packages/database). Generation is offline and needs no environment.
  # ---------------------------------------------------------------------------
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client (offline; no database environment required)
        run: pnpm --filter @brandspace/database exec prisma generate

      - run: pnpm test:unit

  # ---------------------------------------------------------------------------
  # Isolation + RLS tests against a REAL PostgreSQL.
  #
  # These deliberately do not use a mocked database. The application role is
  # created with NOBYPASSRLS and owns no table, exactly as in production — running
  # them as a superuser would make every assertion vacuous, and the suite asserts
  # that it is not privileged before it does anything else.
  # ---------------------------------------------------------------------------
  isolation:
    name: Tenant isolation and RLS (real PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          # Throwaway credential for an ephemeral CI container that is never
          # reachable outside this job. No production secret is used in CI.
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      # Phase 5B. The queue the worker consumes and the dashboard dispatches to.
      # Without it the background-job path is not exercised at all: `enqueue`
      # reports that it could not dispatch, the non-production inline fallback
      # takes over, and a suite that was meant to prove the asynchronous
      # pipeline works proves only that the fallback does.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Create least-privilege database roles
        env:
          PGPASSWORD: postgres
        run: |
          # Throwaway credentials for an ephemeral CI container that is never
          # reachable outside this job. No production secret is used in CI.
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -v migrator_password=ci_migrator \
            -v app_password=ci_app \
            -v platform_password=ci_platform \
            -f scripts/sql/setup-database-roles.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE brandspace_test OWNER brandspace_migrator;"

      # F-01: the whole two-pool model rests on these properties. If any of them
      # is wrong the security tests would pass while proving nothing, so they are
      # asserted before a single test runs.
      - name: Assert the role separation is real
        env:
          PGPASSWORD: postgres
        run: |
          for role in brandspace_app brandspace_platform brandspace_migrator; do
            result=$(psql -h localhost -U postgres -d postgres -Atc \
              "SELECT rolsuper OR rolbypassrls FROM pg_roles WHERE rolname='$role';")
            if [ "$result" != "f" ]; then
              echo "::error::$role is superuser or BYPASSRLS; the isolation suite would prove nothing."
              exit 1
            fi
            echo "$role: rolsuper=false, rolbypassrls=false"
          done

          member=$(psql -h localhost -U postgres -d postgres -Atc \
            "SELECT pg_has_role('brandspace_app','brandspace_platform','MEMBER');")
          if [ "$member" != "f" ]; then
            echo "::error::brandspace_app can SET ROLE into brandspace_platform."
            exit 1
          fi
          echo "brandspace_app is NOT a member of brandspace_platform"

      - name: Write test environment
        run: |
          cat > .env.test <<'ENVEOF'
          NODE_ENV=test
          APP_ENV=development
          LOG_LEVEL=error
          DATA_REGION=local
          DATABASE_URL=postgresql://brandspace_app:ci_app@localhost:5432/brandspace_test?schema=public
          DATABASE_MIGRATION_URL=postgresql://brandspace_migrator:ci_migrator@localhost:5432/brandspace_test?schema=public
          DATABASE_PLATFORM_URL=postgresql://brandspace_platform:ci_platform@localhost:5432/brandspace_test?schema=public
          REDIS_URL=redis://localhost:6379/1
          CUSTOMER_SESSION_SECRET=ci-only-customer-session-secret-0000000000000
          PLATFORM_SESSION_SECRET=ci-only-platform-session-secret-1111111111111
          SECRET_VAULT_KEK=ci-only-vault-key-encryption-key-22222222222222
          # Phase 6 — a SEPARATE key domain for customer social tokens (D-136).
          # Throwaway credentials for an ephemeral CI container. No production
          # secret is used in CI.
          SOCIAL_TOKEN_VAULT_KEK=ci-only-social-token-kek-33333333333333333
          # Phase 9 — a THIRD key domain for a customer's own MFA seed (D-206).
          # The sign-in path must be able to verify a TOTP code, so this key is
          # reachable from the login surface; under either key above that would
          # put platform credentials, or every customer token, in reach of a
          # login request.
          CUSTOMER_MFA_VAULT_KEK=ci-only-customer-mfa-kek-4444444444444444
          # Phase 9 — NOT a payment credential, and there is none in this
          # repository to be one (D-204). It signs and verifies the loopback
          # billing events the DEVELOPMENT adapter produces, so a forged one is
          # refused exactly as a real provider's would be. Required rather than
          # defaulted: the provider registry fails closed without it, which is
          # how the first CI run found this line missing.
          BILLING_DEV_WEBHOOK_SECRET=ci-only-billing-webhook-secret-55555555
          PUBLIC_API_BASE_URL=http://127.0.0.1:3003
          # Phase 6 — where the OAuth callback sends the browser back (D-141).
          PUBLIC_DASHBOARD_BASE_URL=http://127.0.0.1:3001
          BRANDSPACE_API_URL=http://127.0.0.1:3003
          ENVEOF

      - name: Generate Prisma client (offline; migrations below use .env.test)
        run: pnpm --filter @brandspace/database exec prisma generate

      - name: Run isolation and RLS suites
        run: pnpm test:isolation

  # ---------------------------------------------------------------------------
  # F-04: Playwright E2E — RTL/LTR, keyboard, responsive and accessibility across
  # all three interfaces, plus the Control Center's real journeys (sign-in, MFA,
  # the configuration lifecycle, secret handling). Separate from unit and
  # isolation so a browser failure is distinguishable at a glance.
  #
  # The public website and the customer dashboard are statically rendered and get
  # a placeholder database URL. The Control Center is a real database-backed
  # application from Phase 2A onwards, so this job runs a throwaway PostgreSQL and
  # signs in with an account created seconds earlier by `pnpm e2e:seed`. No real
  # credential is used anywhere.
  # ---------------------------------------------------------------------------
  e2e:
    # TWO SHARDS, BY PROJECT (D-455). Each shard is a whole job: its own
    # PostgreSQL and Redis, its own fresh database and seed, its own servers.
    # The aggregate job below keeps the original check name and passes only
    # when both shards pass. Shard 1 carries the desktop project and the
    # Control Center, asset and Brand Brain projects (about 92 minutes of test
    # time on the slowest measured runner); shard 2 the mobile project and every
    # other serial project (about 85). `owner-simple-mode` stays with
    # `admin-console` and `production-email` with `phase10-platform`, the
    # projects they depend on. The coverage step fails the shard if the two
    # lists ever stop covering the whole suite exactly once.
    name: Playwright E2E shard ${{ matrix.shard }} of 2
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      E2E_SHARD_1: >-
        --project=chromium-desktop --project=admin-console --project=owner-simple-mode
        --project=assets --project=brand-brain --project=brand-brain-visual
      E2E_SHARD_2: >-
        --project=chromium-mobile --project=design-system --project=customer-app
        --project=content-calendar --project=brand-context --project=approvals
        --project=analytics-copilot --project=social-publishing --project=phase8-journey
        --project=phase8-flow --project=content-studio --project=phase10-platform
        --project=production-email --project=phase4-security
    # A CEILING, so a hang fails with an uploaded report instead of inheriting
    # GitHub's six-hour default.
    #
    # RAISED FROM 25 TO 45 IN PHASE 10, ON MEASUREMENT RATHER THAN FEELING. The
    # comment here used to say "about three minutes", which was true when it was
    # written and had not been true for several phases: on run #98 the Playwright
    # step took 19m37s and the job 22m41s, leaving 2m19s of headroom against a
    # 25-minute ceiling. That is not headroom, it is a coin toss — a slower
    # runner or one extra retry fails the build for reasons that have nothing to
    # do with the change under review.
    #
    # NOTHING WAS REMOVED TO FIT. The suite is large because it drives real
    # journeys through five processes in two languages and both directions, and
    # Phase 10 adds two more. Cutting coverage to make a number look better is
    # the one change this ceiling must never encourage.
    #
    # AND THE WORKER COUNT STAYS AT TWO. Raising it is the obvious lever and it
    # is not a safe one: a dozen projects here are `fullyParallel: false`
    # precisely because they mutate shared seeded workspaces, and more workers
    # means more of those running against each other — the interleaving the
    # serial mode exists to prevent. A faster suite that fails intermittently is
    # worth less than a slower one that does not.
    #
    # RAISED FROM 45 TO 60 IN PHASE 2C-4, ON MEASUREMENT AGAIN. Run #333 (the
    # last green run before it, PR #54) took 41m10s in the Playwright step and
    # 43m54s for the job: 66 seconds of headroom. Phase 2C-4 adds journeys that
    # wait for the real worker to read uploaded documents, and run #334 was
    # cancelled by this ceiling with 1,005 of 1,016 tests finished and none
    # failed. Nothing was removed to fit, for the reason given above.
    #
    # RAISED FROM 60 TO 90 (D-454). A normal run of the 1,041 tests takes about
    # 47 minutes of Playwright alone (PR #63, first run on 51642f8: 47.2m), and
    # a slower runner then went past 60 twice with nothing failing in the code
    # it was checking. Same rule as above: nothing removed, no retries, workers
    # or sharding changed. Splitting or sharding the suite is tracked for the
    # final review (OPERATIONS §11).
    timeout-minutes: 90

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          # Throwaway credential for an ephemeral CI container that is never
          # reachable outside this job. No production secret is used in CI.
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      # Phase 5B. The queue the worker consumes and the dashboard dispatches to.
      # Without it the background-job path is not exercised at all: `enqueue`
      # reports that it could not dispatch, the non-production inline fallback
      # takes over, and a suite that was meant to prove the asynchronous
      # pipeline works proves only that the fallback does.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Create least-privilege database roles
        env:
          PGPASSWORD: postgres
        run: |
          # Throwaway credentials for an ephemeral CI container that is never
          # reachable outside this job. No production secret is used in CI.
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -v migrator_password=ci_migrator \
            -v app_password=ci_app \
            -v platform_password=ci_platform \
            -f scripts/sql/setup-database-roles.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE brandspace_test OWNER brandspace_migrator;"

      - name: Write test environment
        run: |
          cat > .env.test <<'ENVEOF'
          NODE_ENV=test
          APP_ENV=development
          LOG_LEVEL=error
          DATA_REGION=local
          DATABASE_URL=postgresql://brandspace_app:ci_app@localhost:5432/brandspace_test?schema=public
          DATABASE_MIGRATION_URL=postgresql://brandspace_migrator:ci_migrator@localhost:5432/brandspace_test?schema=public
          DATABASE_PLATFORM_URL=postgresql://brandspace_platform:ci_platform@localhost:5432/brandspace_test?schema=public
          REDIS_URL=redis://localhost:6379/1
          CUSTOMER_SESSION_SECRET=ci-only-customer-session-secret-0000000000000
          PLATFORM_SESSION_SECRET=ci-only-platform-session-secret-1111111111111
          SECRET_VAULT_KEK=ci-only-vault-key-encryption-key-22222222222222
          # Phase 6 — a SEPARATE key domain for customer social tokens (D-136).
          # Throwaway credentials for an ephemeral CI container. No production
          # secret is used in CI.
          SOCIAL_TOKEN_VAULT_KEK=ci-only-social-token-kek-33333333333333333
          # Phase 9 — a THIRD key domain for a customer's own MFA seed (D-206).
          # The sign-in path must be able to verify a TOTP code, so this key is
          # reachable from the login surface; under either key above that would
          # put platform credentials, or every customer token, in reach of a
          # login request.
          CUSTOMER_MFA_VAULT_KEK=ci-only-customer-mfa-kek-4444444444444444
          # Phase 9 — NOT a payment credential, and there is none in this
          # repository to be one (D-204). It signs and verifies the loopback
          # billing events the DEVELOPMENT adapter produces, so a forged one is
          # refused exactly as a real provider's would be. Required rather than
          # defaulted: the provider registry fails closed without it, which is
          # how the first CI run found this line missing.
          BILLING_DEV_WEBHOOK_SECRET=ci-only-billing-webhook-secret-55555555
          PUBLIC_API_BASE_URL=http://127.0.0.1:3003
          # Phase 6 — where the OAuth callback sends the browser back (D-141).
          PUBLIC_DASHBOARD_BASE_URL=http://127.0.0.1:3001
          BRANDSPACE_API_URL=http://127.0.0.1:3003
          ENVEOF

      - name: Generate Prisma client (offline)
        run: pnpm --filter @brandspace/database exec prisma generate

      # D-455: nothing may fall between the shards or run in both. The two
      # shards' test lists, together, must equal the whole suite's list.
      - name: The two shards cover the whole suite exactly once
        run: |
          list() { pnpm exec playwright test --list --reporter=list "$@" | grep -E '^\s+\[' | sed -E 's/^\s+//' | sort; }
          list > all.txt
          list $E2E_SHARD_1 > s1.txt
          list $E2E_SHARD_2 > s2.txt
          sort s1.txt s2.txt > both.txt
          echo "suite $(wc -l < all.txt) · shard 1 $(wc -l < s1.txt) · shard 2 $(wc -l < s2.txt)"
          if ! diff -q all.txt both.txt > /dev/null; then
            echo "::error::The E2E shards do not cover the suite exactly once."
            diff all.txt both.txt | head -40
            exit 1
          fi
          rm -f all.txt s1.txt s2.txt both.txt

      - name: Apply migrations to the end-to-end database
        env:
          NODE_ENV: test
        run: pnpm db:migrate:deploy

      - name: Install Chromium and its system dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Build the three applications
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
        run: pnpm e2e:build

      # `pnpm test:e2e` seeds the throwaway admin account first, then runs
      # Playwright. The Playwright config reads .env.test for the Control
      # Center's database connection; the other two apps get a placeholder.
      #
      # BRANDSPACE_VISUAL_BASELINE=0 turns off the PIXEL half of the Brand Brain
      # visual suite, and only that half. Its DOM-geometry assertions — the
      # binding ones, measured against the demo's own numbers — run here in
      # full. The pixel baselines are committed from a developer machine, and
      # this page uses a system font stack, so a runner with different fonts
      # rasterises the same layout differently; a baseline that has to be
      # re-approved whenever the image changes teaches exactly the habit
      # docs/UI-FIDELITY-CONTRACT.md §5 forbids.
      - name: Run Playwright
        env:
          BRANDSPACE_VISUAL_BASELINE: '0'
        run: |
          if [ "${{ matrix.shard }}" = 1 ]; then PROJECTS=$E2E_SHARD_1; else PROJECTS=$E2E_SHARD_2; fi
          pnpm e2e:seed
          pnpm exec playwright test $PROJECTS

      # Failure artifacts only. Traces and screenshots are of the applications
      # themselves; the run has no real credential to capture, and the throwaway
      # admin password is regenerated on every seed.
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

      # Execution evidence on EVERY run, pass or fail: which test ran, in which
      # project, with what result and how many retries. Separate from the
      # failure-only artifact above, and evidence only — it never decides
      # whether the job passes. Absent when the job failed before Playwright ran.
      - name: Upload Playwright JSON results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-json-shard-${{ matrix.shard }}
          path: playwright-json/results.json
          retention-days: 7
          if-no-files-found: ignore

      # The same evidence, readable in the job log: one line per test of the
      # Phase 2B-3 PR 2, PR 3 and PR 4 specs — project | title | status | retry.
      # It only reads the report and can never fail the job.
      - name: Print Phase 2B-3 PR 2, PR 3 and PR 4 spec results
        if: always()
        continue-on-error: true
        run: |
          node -e "
          const fs = require('fs');
          const file = 'playwright-json/results.json';
          if (!fs.existsSync(file)) { console.log('E2E-EVIDENCE no ' + file); process.exit(0); }
          const report = JSON.parse(fs.readFileSync(file, 'utf8'));
          const walk = (suite) => {
            for (const spec of suite.specs ?? []) {
              if (!['phase2b3-pr2-g13-authoring.spec.ts', 'phase2b3-pr3-timed-authoring.spec.ts', 'phase2b3-pr4-analytics-authoring.spec.ts'].some((name) => spec.file.endsWith(name))) continue;
              for (const test of spec.tests) {
                const last = test.results.at(-1);
                console.log(['E2E-EVIDENCE', test.projectName, spec.title, last ? last.status : 'not run', last ? last.retry : '-'].join(' | '));
              }
            }
            for (const child of suite.suites ?? []) walk(child);
          };
          for (const suite of report.suites ?? []) walk(suite);
          "

  # ---------------------------------------------------------------------------
  # D-455: THE ORIGINAL CHECK NAME, AS AN AGGREGATE. It passes only when both
  # E2E shards passed, so anything that requires "Playwright E2E (RTL/LTR +
  # accessibility)" still means "the whole suite passed". A skipped, cancelled
  # or failed shard fails it.
  # ---------------------------------------------------------------------------
  e2e-result:
    name: Playwright E2E (RTL/LTR + accessibility)
    needs: e2e
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Both shards passed
        run: |
          echo "E2E shards: ${{ needs.e2e.result }}"
          test "${{ needs.e2e.result }}" = success

  # ---------------------------------------------------------------------------
  # Nothing resembling a credential may enter the repository.
  # ---------------------------------------------------------------------------
  secrets-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Reject committed .env files
        run: |
          if git ls-files | grep -E '^\.env$|^\.env\.(local|development|staging|production|test)$'; then
            echo "::error::A .env file is tracked. Only .env.example and .env.test.example may be committed."
            exit 1
          fi
          echo "No tracked .env files."

      - name: Scan for credential-shaped strings
        run: |
          pattern='(sk-[A-Za-z0-9_-]{16,}|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----)'

          # A handful of files MUST contain credential-shaped strings, because
          # that is what they are testing: the redaction layer, the secret
          # vault, and the span sanitiser are all asserted against values with
          # the shape a real key has. They are excluded here and checked by the
          # stricter pass below instead of being trusted outright.
          allowlist=(
            ':!tests/unit/redaction.test.ts'          # proves redaction catches these shapes
            ':!tests/unit/secret-crypto.test.ts'      # proves masking reveals at most four characters
            ':!tests/unit/observability.test.ts'      # proves no such value reaches a span
            ':!tests/unit/public-error.test.ts'        # proves no such value reaches the client
            ':!tests/unit/error-boundary.test.ts'      # proves no such value reaches URL, UI, log or span
            ':!tests/isolation/platform-services.test.ts'  # proves nothing is stored in plaintext
            ':!packages/shared/src/redaction.ts'      # the patterns themselves
            ':!pnpm-lock.yaml'
          )

          if git grep -nIE "$pattern" -- . "${allowlist[@]}"; then
            echo "::error::A credential-shaped string was found in tracked files."
            exit 1
          fi
          echo "No credential-shaped strings found outside the test fixtures."

      # The allowlist above must not become a place where a real key can hide.
      # Every credential-shaped string in those files has to be visibly fake:
      # a sequential alphabet run that no generated key would ever contain.
      - name: Fixtures in the allowlisted files must be visibly fake
        run: |
          pattern='(sk-[A-Za-z0-9_-]{16,}|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{20,})'
          files=(
            tests/unit/redaction.test.ts
            tests/unit/secret-crypto.test.ts
            tests/unit/observability.test.ts
            tests/unit/public-error.test.ts
            tests/unit/error-boundary.test.ts
            tests/isolation/platform-services.test.ts
          )
          bad=0
          for file in "${files[@]}"; do
            while IFS= read -r match; do
              case "$match" in
                *abcdefgh*|*EXAMPLE*) ;;
                *) echo "::error file=$file::'$match' does not look like an obvious fixture"; bad=1 ;;
              esac
            done < <(grep -oE "$pattern" "$file" || true)
          done
          if [ "$bad" -ne 0 ]; then
            echo "::error::A credential-shaped string in an allowlisted file is not visibly a fixture."
            exit 1
          fi
          echo "All fixtures in the allowlisted files are visibly fake."

  # ---------------------------------------------------------------------------
  # Application builds must succeed.
  # ---------------------------------------------------------------------------
  build:
    name: Build applications
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client (no database environment required)
        run: pnpm --filter @brandspace/database exec prisma generate

      - name: Build Next.js applications
        env:
          # Build-time only; no real infrastructure is contacted.
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
        run: |
          pnpm --filter @brandspace/web build
          pnpm --filter @brandspace/dashboard build
          pnpm --filter @brandspace/admin build
